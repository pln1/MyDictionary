<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDictionary</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <div class="logo" id="nav-home">MyDictionary</div>
        <div class="nav-actions" id="auth-menu">
            <button id="btn-login-modal">Log In</button>
            <button id="btn-register-modal">Sign Up</button>
        </div>
        <div class="nav-actions hidden" id="user-menu">
            <span id="user-name-display"></span>
            <button id="btn-dashboard">Dashboard</button>
            <button id="btn-logout">Log Out</button>
        </div>
    </header>

    <main id="app-container">
        <section id="view-translator" class="view-section">
            <div class="translator-container">
                <div class="lang-controls">
                    <select id="trans-source-lang">
                        <option value="en" selected>English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="ru">Russian</option>
                        <option value="uk">Ukrainian</option>
                    </select>
                    
                    <button id="btn-swap-langs" class="swap-btn" title="Swap languages">⇄</button>
                    
                    <select id="trans-target-lang">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="ru">Russian</option>
                        <option value="uk" selected>Ukrainian</option>
                    </select>
                </div>
                <div id="lang-error" class="error-msg hidden">Languages must be different!</div>
                
                <div class="trans-inputs">
                    <textarea id="trans-input" placeholder="Enter text..."></textarea>
                    <textarea id="trans-output" readonly placeholder="Translation..."></textarea>
                </div>
                <button id="btn-translate">Translate</button>
                <div id="trans-auth-prompt" class="auth-prompt">
                    <a href="#" id="link-login-prompt">Log in</a> to save words.
                </div>
                <button id="btn-save-translation" class="hidden">Save to Dictionary</button>
            </div>
        </section>

        <section id="view-dashboard" class="view-section hidden">
            <div class="dashboard-layout">
                <aside class="sidebar">
                    <button id="btn-new-topic">+ New Topic</button>
                    <ul id="topic-list" class="drag-container">
                        <!-- Topics render here -->
                    </ul>
                </aside>

                <div class="main-content">
                    <header class="topic-header">
                        <h2 id="current-topic-name">Saved</h2>
                        <div class="topic-actions" style="position: relative;">
                            <button id="btn-topic-options">⋮</button>
                            <div id="topic-dropdown" class="dropdown-menu hidden">
                                <button id="btn-rename-topic">Rename Topic</button>
                                <button id="btn-delete-topic" class="danger">Delete Topic</button>
                            </div>
                        </div>
                    </header>
                    <div id="unit-list" class="drag-container">
                        <!-- Units render here -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="auth-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title">Sign In</h2>
            <form id="auth-form">
                <input type="text" id="auth-username" placeholder="Username" required>
                <input type="password" id="auth-password" placeholder="Password" required>
                <div id="auth-error" class="error-msg"></div>
                <button type="submit" id="auth-submit">Log In</button>
                <div class="auth-toggle">
                    <a href="#" id="auth-toggle-link">Don't have an account? Sign Up</a>
                </div>
            </form>
        </div>
    </div>

    <div id="input-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="input-modal-close">&times;</span>
            <h2 id="input-modal-title">Enter Value</h2>
            <input type="text" id="input-modal-field" placeholder="..." required>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="input-modal-cancel" style="background: #ccc; color: #333;">Cancel</button>
                <button id="input-modal-save">Save</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/translator.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
