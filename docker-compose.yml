version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mydict_db
      POSTGRES_USER: mydict_user
      POSTGRES_PASSWORD: superpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - mongodb

volumes:
  postgres_data:
  mongo_data: