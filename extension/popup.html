<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <h3>MyDictionary</h3>
    <div id="login-section">
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button id="login-btn">Sign In</button>
        <p id="error-msg" class="msg error">Login failed. Check credentials.</p>
    </div>

    <div id="settings-section" class="hidden">
        <label for="source-lang">Translate from:</label>
        <select id="source-lang">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="ru">Russian</option>
            <option value="uk">Ukrainian</option>
        </select>

        <label for="target-lang">Translate to:</label>
        <select id="target-lang">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="ru">Russian</option>
            <option value="uk">Ukrainian</option>
        </select>
        <p id="lang-error-msg" class="msg error">Languages must be different!</p>
        <button id="save-btn">Save Settings</button>
        <button id="logout-btn" class="logout-btn">Log Out</button>
        <p id="status-msg" class="msg success">Settings saved!</p>
    </div>

    <script src="popup.js"></script>
</body>
</html>
